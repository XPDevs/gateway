<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Gateway</title>
    <link rel="stylesheet" href="ui.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script>if(localStorage.getItem('gw-dark')==='1')document.documentElement.classList.add('dark')</script>
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        .error-page { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
        .error-page h1 { font-size: 72px; font-weight: 700; margin: 0 0 8px; color: var(--primary); line-height: 1; }
        .error-page h2 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
        .error-page p { font-size: 14px; color: var(--text-secondary); margin: 0 0 28px; max-width: 420px; line-height: 1.6; }
        .error-page a { color: var(--link); }
        .error-page .btn { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 28px; border-radius: 24px; }
        .error-page .btn:hover { text-decoration: none; opacity: .9; }
    </style>
</head>
<body>
<nav class="top-nav">
    <div class="top-nav-left">
        <a href="./" class="results-logo" style="font-size:22px;font-weight:700;letter-spacing:-0.03em;text-decoration:none"><span>G</span><span>a</span><span>t</span><span>e</span><span>w</span><span>a</span><span>y</span></a>
    </div>
    <div class="top-nav-right">
        <button class="icon-btn" onclick="toggleDarkMode()" title="Toggle dark mode">
            <svg class="sun" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg class="moon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
    </div>
</nav>
<div class="error-page">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you are looking for may have moved or no longer exists. Try returning to the Gateway homepage.</p>
    <a class="btn" href="./">Back to Gateway</a>
</div>
<footer class="footer">
    <div class="footer-country" data-i18n-country>United Kingdom</div>
    <div class="footer-links">
        <div class="links-group">
            <a href="about/">About</a>
            <a href="advertising/">Advertising</a>
            <a href="business/">Business</a>
            <a href="how-search-works/">How Search works</a>
        </div>
        <div class="links-group">
            <a href="privacy/">Privacy</a>
            <a href="terms/">Terms</a>
            <a href="https://xpdevs.github.io" target="_self" class="footer-brand" style="text-decoration:none;color:inherit"><img src="https://xpdevs.github.io/logo/XPDevs.png" alt="XPDevs" onerror="this.style.display='none'">XPDevs</a>
        </div>
    </div>
</footer>
<script>
(function(){'use strict';function applyDark(enabled){document.documentElement.classList.toggle('dark',enabled);document.body.classList.toggle('dark',enabled);localStorage.setItem('gw-dark',enabled?'1':'0');document.querySelectorAll('.sun').forEach(el=>el.style.display=enabled?'none':'');document.querySelectorAll('.moon').forEach(el=>el.style.display=enabled?'':'none')}
window.toggleDarkMode=function(){applyDark(!document.documentElement.classList.contains('dark'))};if(localStorage.getItem('gw-dark')==='1')applyDark(true)
var m = window.location.pathname.match(/\/([a-z-]+)\.html$/);
if (m) { window.location.replace(window.location.origin + window.location.pathname.replace(/\.html$/, '') + '/'); }
})();</script>
</body>
</html>
